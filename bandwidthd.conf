# pkg(8) repository for os-bandwidthd on OPNsense.
# Install to /usr/local/etc/pkg/repos/bandwidthd.conf — see install-repo.sh.
bandwidthd: {
  url: "https://sioakim.github.io/opnsense-bandwidthd/${ABI}",
  signature_type: "fingerprints",
  fingerprints: "/usr/local/etc/pkg/fingerprints/bandwidthd",
  enabled: yes
}
