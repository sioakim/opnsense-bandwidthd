[start]
command:/usr/local/etc/rc.d/bandwidthd onestart
parameters:
type:script
message:starting bandwidthd
description:Start BandwidthD

[stop]
command:/usr/local/etc/rc.d/bandwidthd onestop
parameters:
type:script
message:stopping bandwidthd
description:Stop BandwidthD

[restart]
command:/usr/local/etc/rc.d/bandwidthd onerestart
parameters:
type:script
message:restarting bandwidthd
description:Restart BandwidthD

[status]
command:/usr/local/etc/rc.d/bandwidthd onestatus
parameters:
type:script_output
message:requesting bandwidthd status
description:Get BandwidthD status

; Regenerate /usr/local/bandwidthd/etc/bandwidthd.conf from config.xml without
; touching the running daemon.
[configure]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Bandwidthd/setup.php
parameters:
type:script_output
message:generating bandwidthd configuration
description:Generate BandwidthD configuration

; Cron-driven jobs. Each is safe to run by hand and supports --dry-run.
[alerts]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Bandwidthd/alerts.php
parameters:%s
type:script_output
message:evaluating bandwidthd traffic alerts
description:Evaluate BandwidthD traffic alerts

[report]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Bandwidthd/report.php
parameters:%s
type:script_output
message:sending bandwidthd usage report
description:Send BandwidthD usage report

[dbexport]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Bandwidthd/dbexport.php
parameters:%s
type:script_output
message:exporting bandwidthd history
description:Export BandwidthD history to PostgreSQL

[dbmaint]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Bandwidthd/dbmaint.php
parameters:%s
type:script_output
message:running bandwidthd database maintenance
description:Run BandwidthD database maintenance

[dbtest]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Bandwidthd/dbmaint.php -- --test
parameters:
type:script_output
message:testing bandwidthd database connection
description:Test the BandwidthD history database connection

[probe]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/Bandwidthd/probe.php
parameters:%s
type:script_output
message:fingerprinting bandwidthd devices
description:Fingerprint devices seen by BandwidthD

; Rotate the CDF logs (bandwidthd re-opens them on SIGHUP).
[rotate]
command:/bin/pkill -HUP -F /var/run/bandwidthd.pid
parameters:
type:script
message:rotating bandwidthd logs
description:Rotate BandwidthD logs
