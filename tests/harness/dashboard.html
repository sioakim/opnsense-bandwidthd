<!doctype html>
<meta charset="utf-8">
<title>BandwidthD dashboard harness</title>
<!--
  Runs the REAL dashboard JS against captured (anonymised) API fixtures, with no
  firewall. Catches what php -l and node --check cannot: a runtime error in the
  page, or the JS asking for an endpoint that does not exist.

  Open tests/harness/dashboard.html in a browser, or drive it headless.
-->
<script>
  window.__bwdCalls = [];
  window.__bwdErrors = [];
  window.addEventListener('error', function (e) { window.__bwdErrors.push(String(e.message)); });
  window.addEventListener('unhandledrejection', function (e) { window.__bwdErrors.push('rejection: ' + e.reason); });

  // Map /api/bandwidthd/data/<action> onto a fixture file. An action with no
  // fixture is recorded and answered with {} — it shows up as an unmapped call
  // rather than a silent failure.
  var FIXTURES = ['status', 'hosts', 'overview', 'series', 'percentile', 'daily', 'tags'];
  window.fetch = function (url, opts) {
    window.__bwdCalls.push({ url: String(url), method: (opts && opts.method) || 'GET',
                             csrf: !!(opts && opts.headers && opts.headers['X-CSRFToken']) });
    var m = String(url).match(/\/api\/bandwidthd\/data\/(\w+)/);
    var action = m ? m[1] : '';
    if (FIXTURES.indexOf(action) >= 0) {
      return fetch_real(action + '.json');
    }
    return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve({}); } });
  };
  function fetch_real(file) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open('GET', file, true);
      x.onload = function () {
        var body = x.responseText;
        resolve({ ok: true, status: 200, json: function () { return Promise.resolve(JSON.parse(body)); } });
      };
      x.onerror = function () { reject(new Error('fixture load failed: ' + file)); };
      x.send();
    });
  }
</script>

</script>

                        <button type="button" class="bwd-window" data-secs="21600" aria-pressed="false" data-period="1">6h</button>

                        <button type="button" class="bwd-window" data-secs="604800" aria-pressed="false" data-period="2">7d</button>
                        <button type="button" class="bwd-window" data-secs="2592000" aria-pressed="false" data-period="3">30d</button>
                        <button type="button" class="bwd-window" data-secs="31536000" aria-pressed="false" data-period="4">1y</button>
                        <button type="button" class="bwd-window bwd-window-custom" data-custom="1" aria-expanded="false" aria-controls="bwd-customrange">Custom</button>
                    </div>
                    <div class="bwd-totals">

                        <span class="bwd-pill bwd-out"><i></i>Out <b id="bwd-tot-out">–</b></span>
                        <span class="bwd-export" role="group" aria-label="Export data">

                            <button type="button" id="bwd-export-json" class="bwd-export-btn" title="Download the host table for this window as JSON (honours the tag filter; the search box is not applied)">JSON</button>

                        <span class="bwd-updated" id="bwd-updated" role="status"></span>
                    </div>

                <div class="bwd-customrange" id="bwd-customrange" hidden>

                    <label class="bwd-dt">From <input type="datetime-local" id="bwd-from"></label>
                    <label class="bwd-dt">To <input type="datetime-local" id="bwd-to"></label>
                    <button type="button" id="bwd-range-reset" class="bwd-range-reset" title="Back to 24h">Reset</button>

<script>
  // Report once the dashboard has had a chance to load and render.
  setTimeout(function () {
    var byAction = {};
    window.__bwdCalls.forEach(function (c) {
      var m = c.url.match(/\/api\/bandwidthd\/data\/(\w+)/);
      if (m) { byAction[m[1]] = (byAction[m[1]] || 0) + 1; }
    });
    window.__bwdResult = {
      errors: window.__bwdErrors,
      actions: byAction,
      calls: window.__bwdCalls.length,
      nonApiCalls: window.__bwdCalls.filter(function (c) { return c.url.indexOf('/api/bandwidthd/data/') < 0; }).map(function (c) { return c.url; }),
      hostRows: document.querySelectorAll('#bwd-hostlist li').length,
      heroTotal: (document.querySelector('#bwd-hero-total') || {}).textContent,
      totalIn: (document.querySelector('#bwd-tot-in') || {}).textContent,
      cards: document.querySelectorAll('#bwd-cards > *').length,
      charts: document.querySelectorAll('canvas').length
    };
    var el = document.createElement('pre');
    el.id = 'bwd-harness-result';
    el.textContent = JSON.stringify(window.__bwdResult, null, 2);
    document.body.appendChild(el);
  }, 2500);
</script>
